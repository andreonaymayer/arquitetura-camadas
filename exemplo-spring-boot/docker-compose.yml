services:
  postgres:
    image: postgres:16
    container_name: catalogo-postgres
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - catalogo-dados:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro

volumes:
  catalogo-dados:
